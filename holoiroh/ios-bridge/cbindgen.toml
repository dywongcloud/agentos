# cbindgen config for generating include/HoloirohIosBridge.h from this crate's
# `extern "C"` surface. Run from the workspace root:
#
#   cargo run -p holoiroh-ios-bridge --example generate_header
#
# The header is the primary Swift-visible surface (there is no uniffi codegen
# on the iroh-live side -- see ../ios/IROH_FFI.md), so it is committed, not a
# build-time throwaway. Regenerate it whenever the `extern "C"` signatures in
# src/lib.rs change.

language = "C"
pragma_once = true
include_guard = "HOLOIROH_IOS_BRIDGE_H"
autogen_warning = "/* Generated by cbindgen from holoiroh/ios-bridge/src/lib.rs -- do not edit by hand; regenerate with `cargo run -p holoiroh-ios-bridge --example generate_header`. */"
cpp_compat = true
documentation = true
documentation_style = "doxy"
style = "type"
after_includes = """
typedef struct HoloirohBridge HoloirohBridge;
typedef struct HoloirohSubscription HoloirohSubscription;
"""

[export]
exclude = ["HoloirohBridge", "HoloirohSubscription"]
# Emit the status/pixel-format constants and the opaque/frame types.
include = [
  "HoloirohBridge",
  "HoloirohSubscription",
  "HoloirohFrame",
  "HoloirohStatus",
  "holoiroh_ios_bridge_new",
  "holoiroh_ios_bridge_new_with_secret_key",
  "holoiroh_ios_bridge_free",
  "holoiroh_ios_bridge_probe_reachable",
  "holoiroh_ios_bridge_probe_reachable_with_secret_key",
  "holoiroh_ios_bridge_ticket_connect",
  "holoiroh_ios_bridge_subscribe",
  "holoiroh_ios_bridge_subscription_free",
  "holoiroh_ios_bridge_poll_next_frame",
  "holoiroh_ios_bridge_control_connect",
  "holoiroh_ios_bridge_control_send",
  "holoiroh_ios_bridge_poll_control_event",
  "holoiroh_ios_bridge_free_error_string",
]

[parse]
parse_deps = false
