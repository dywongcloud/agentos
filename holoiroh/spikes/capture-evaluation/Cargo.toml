[workspace]

[package]
name = "capture-evaluation-spike"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
futures-lite = "2.6"
libc = "0.2"
rusty-capture = { path = "../../../holoiroh-vendor/iroh-live-patched/rusty-capture", default-features = false, features = ["screen-apple"] }
rusty-codecs = { path = "../../../holoiroh-vendor/iroh-live-patched/rusty-codecs", default-features = false, features = ["h264", "videotoolbox"] }
screencapturekit = { version = "=8.0.1", features = ["async", "macos_15_2"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
