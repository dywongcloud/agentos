[package]
name = "holoiroh-wire-wasm-demo"
version = "0.1.0"
edition = "2024"
description = "Real wasm32-wasip1 binary exercising holoiroh-wire's TaskEnvelope construction, JSON serialization, and validate_inbound expiry/replay/sequence checks with no daemon, no iroh, no macOS dependency -- the witnessed artifact for the wasm32-wasip1 build row."

[dependencies]
holoiroh-wire = { path = "../holoiroh-wire" }
serde_json = "1"
