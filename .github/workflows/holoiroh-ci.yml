name: holoiroh CI

# Real build + witness pipeline for the holoiroh product (Rust mac-daemon +
# ios-bridge P2P computer-use over iroh-live). The mac-daemon links macOS
# frameworks (ScreenCaptureKit via iroh-live's capture backend, objc2
# CoreGraphics/ApplicationServices) so the workspace only builds on macOS --
# hence macos-latest, not ubuntu.
#
# This replaces the inherited Docker-publish workflows, which belonged to the
# unrelated agentOS Next.js bot and published images to a foreign Docker Hub
# account. This pipeline needs no secrets: it builds the real code and runs the
# platform-independent example probes as genuine, exit-0 witnesses. Probes that
# require live macOS TCC grants / screen capture / a running holo serve are
# intentionally NOT run here (they cannot pass headlessly); the ones run below
# are the pure-logic witnesses that exercise real code paths deterministically.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: holoiroh-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-witness:
    name: build workspace + run probe witnesses
    runs-on: macos-latest
    defaults:
      run:
        working-directory: holoiroh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            holoiroh/target
          key: holoiroh-cargo-${{ runner.os }}-${{ hashFiles('holoiroh/**/Cargo.toml') }}
          restore-keys: |
            holoiroh-cargo-${{ runner.os }}-

      - name: Build the whole workspace (mac-daemon + ios-bridge) with all examples
        run: cargo build --workspace --examples --locked

      - name: Witness pure-logic probes (real code paths, deterministic, no TCC/device needed)
        run: |
          set -euo pipefail
          # Each probe below runs a real code path and exits 0 on success (asserts
          # inside panic on failure). These are the witnesses that do NOT require a
          # live macOS TCC grant, screen capture, a real device, or a running holo
          # serve -- so they pass headlessly in CI. The TCC/device/live-network
          # probes (e.g. a full daemon run) are intentionally excluded; see this
          # file's header and holoiroh/mac-daemon/PAIRING.md.
          for probe in \
            duration_probe_via_ticket_rotation \
            ticket_rotation_probe \
            pairing_phrase_probe \
            policy_probe \
            sensitive_categories_probe \
            allowlist_probe \
            auth_gate_probe \
            auth_probe \
            audit_log_probe \
            control_channel_probe \
            envelope_probe \
            limits_probe \
            task_state_probe \
            registry_probe \
            permissions_probe \
            qr_probe \
            input_request_probe \
            local_model_edge_probe \
            serve_guard_probe \
            pause_redirect_probe \
            frontmost_app_probe \
            process_awareness_probe \
            task_active_wire_probe \
            task_framing_probe \
            auto_yield_probe \
            remote_control_wire_probe \
            current_ticket_wire_probe \
            clarify_wire_probe \
            self_correction_probe \
            stall_watchdog_probe \
            consent_pause_not_a_stall_probe \
            self_canceled_stream_probe \
            spawn_retry_budget_probe \
            no_tier_switch_under_live_stream_probe \
            error_chain_logging_probe \
            tmux_guidance_probe
          do
            # duration parsing is witnessed by ticket_rotation_probe; skip the alias
            [ "$probe" = "duration_probe_via_ticket_rotation" ] && continue
            echo "::group::probe $probe"
            cargo run --example "$probe" -p holoiroh-daemon --locked
            echo "::endgroup::"
          done
          echo "All pure-logic holoiroh probes passed as real-execution witnesses."

      - name: Witness remote-control input ordering (needs the dry-run injection seam)
        env:
          # Records injected moves instead of posting real CGEvents, so this exercises the true
          # `remote_input` path without driving the runner's cursor. The probe asserts the var is
          # set rather than silently degrading.
          HOLOIROH_INPUT_DRY_RUN: "1"
        run: |
          set -euo pipefail
          cargo run --example remote_input_ordering_probe -p holoiroh-daemon --locked
          # Derives double/triple-click from timing+distance the way the window server does, so
          # the phone never has to stall a tap for half a second to find out which it was.
          cargo run --example click_state_probe -p holoiroh-daemon --locked
          # End-to-end over a REAL iroh connection on loopback: both ends in one process so both
          # timestamps share a clock. Floors what the daemon itself costs (framing, decode,
          # dispatch, injection) and proves order survives a real connection. Asserts on the
          # median, not a tail percentile, so a busy runner cannot make it flaky.
          cargo run --release --example input_latency_probe -p holoiroh-daemon --locked

      - name: Witness iOS ConnectionProfileRepository conformance (macOS Swift)
        run: |
          set -euo pipefail
          # Compiles the REAL ConnectionProfileRepository + ConnectionProfileStore
          # and asserts the always-present-default invariants (fresh / reopen /
          # delete-reseed / stale-filter / broken-sqlite). Exits non-zero on any
          # regression -- a permanent guard on the hard-won device-confirmed fix.
          bash ios/Tools/RepositoryConformanceCheck/run.sh

      - name: Witness remote-control touch mapping at every zoom level (macOS Swift)
        run: |
          set -euo pipefail
          # Compiles the REAL VideoViewportTransform + normalizedInVideo and asserts a touch
          # drives the Mac cursor to the pixel under the finger at every zoom the pinch can
          # reach. Before this, the mapping ignored the live zoom/pan entirely: at 2x it landed
          # the cursor ~557 desktop px away, which is what made aiming on a phone feel broken.
          # Also scans the production call sites, which live behind `#if canImport(UIKit)` and
          # so are not compiled by this check.
          bash ios/Tools/CursorMappingCheck/run.sh

      - name: Witness cursor-move send policy under a slow link (macOS Swift)
        run: |
          set -euo pipefail
          # Drives the REAL MoveCoalescer through the stage-then-flush pattern the iOS sender
          # uses, at display-refresh staging rate, against fast and slow stand-in writes.
          # Asserts a nearby LAN loses nothing while a slow link collapses superseded moves
          # instead of queueing a backlog the cursor spends seconds replaying -- and that the
          # finger's final position is delivered either way.
          bash ios/Tools/MoveCoalescingCheck/run.sh
